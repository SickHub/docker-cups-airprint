name: Build image

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # weekly rebuild so base images and dependencies stay current
    - cron: '0 6 * * 1'
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: airprint-bridge

jobs:
  build:
    name: Build (${{ matrix.ubuntu_version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ubuntu_version:
          - latest
          - noble
          - jammy
          - focal
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}
        if: github.event_name != 'pull_request'

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ secrets.DOCKER_USER }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ matrix.ubuntu_version }}
            type=raw,value=${{ matrix.ubuntu_version }}-latest
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm/v7,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            UBUNTU_VERSION=${{ matrix.ubuntu_version }}
